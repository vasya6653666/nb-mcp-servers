# Publishes one package to npm when a tag "<folder>-v<version>" is pushed,
# for example "infra-as-code-v1.0.0" publishes packages/infra-as-code.
# npm trusts this workflow file (trusted publishing over OIDC): no npm token is stored in the repository.
name: publish

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package from tag
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-v[0-9]*) ;;
            *) echo "Tag $TAG is not <folder>-v<version>"; exit 1 ;;
          esac
          dir="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$dir" in
            *[!a-z0-9-]*|"") echo "Bad folder name in tag: $dir"; exit 1 ;;
          esac
          echo "dir=packages/$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check version matches tag
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          WANT: ${{ steps.pkg.outputs.version }}
        run: |
          have="$(node -p "require('./package.json').version")"
          if [ "$have" != "$WANT" ]; then echo "package.json has $have, tag says $WANT"; exit 1; fi

      - name: Install and test
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm ci
          npm test

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
